name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the lockfile authoritative: a stale one should fail the build rather than
  # being silently updated, so that CI compiles what a contributor compiled.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # Formatting, lints and documentation. One platform is enough — none of these
  # depend on the target.
  #
  # `-D warnings` is passed to clippy and rustdoc rather than set in RUSTFLAGS,
  # because RUSTFLAGS also applies to dependencies and would make this build fail on
  # a warning in somebody else's crate. Clippy runs the rustc lints too, so our own
  # warnings are still errors here.
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  # The test suite on every platform we claim to work on.
  #
  # This is also how the determinism claim is enforced:
  # `rng::tests::the_stream_is_pinned` asserts a hardcoded digest of ten thousand
  # draws, so a platform whose floating point or integer arithmetic differed would
  # fail here rather than quietly producing a different image. Running the matrix is
  # the test.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked --workspace

  # The same suite with optimisation and link-time optimisation on.
  #
  # An orthogonal axis to the platform matrix, so one platform suffices. Worth its
  # own job because the physics tests compare against closed forms at tight
  # tolerances and the pinned RNG digest is exact: if any of that depended on the
  # optimisation level, the results would not be reproducible between a debug run
  # and a release one, which is a weaker guarantee than the crate claims.
  release:
    name: test (release, LTO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --release
        run: cargo test --locked --workspace --release

  # The examples, actually run rather than only compiled.
  #
  # `clippy --all-targets` already builds them, which catches an API that moved. It does
  # not catch an example that compiles and then prints nonsense — and an example is a
  # claim that the library works, so a broken one is worse than none. Every number they
  # print is asserted against a closed form or an independent calculation, so running
  # them *is* the check.
  #
  # No argument means "print and assert"; an argument would make them write an SVG. CI
  # passes none, so nothing is generated and nothing generated is ever committed.
  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Release, because one of them draws two hundred thousand samples from the noise
      # model to check a variance against a mean, and debug takes a minute over it.
      - name: run every example
        run: |
          set -euo pipefail
          for example in beam_hot_spot airy_pattern detector_snr room_modes melting lens_spots heat_in_three_dimensions room_in_three_dimensions busbar_rating optical_bench espresso_shot portafilter_flow agents_quickstart readme_check; do
            echo "::group::$example"
            cargo run --locked --release --example "$example"
            echo "::endgroup::"
          done
          # And every shipped scene, through the application rather than the test harness.
          # `tests/scene.rs` already runs them and asserts a number each; this runs the real
          # binary on the real files, which is the thing a reader will type.
          for scene in crates/pantometry-world/scenes/*.json; do
            echo "::group::$scene"
            # `--check` first: it is the path an editor uses while somebody is typing, and it
            # would otherwise be the only entry point CI never touches.
            cargo run --locked --release -p pantometry-world -- --check "$scene"
            cargo run --locked --release -p pantometry-world -- "$scene"
            echo "::endgroup::"
          done

  # The HTML report's viewer, executed rather than grepped.
  #
  # A separate job because it needs node, and the gate in CONTRIBUTING.md is the toolchain a Rust
  # change needs — the same reason `bindings/python` is its own job. No npm, no lockfile, no
  # install step: `tools/report-check` is two files and the standard library.
  #
  # The reason it exists at all is that the report inlines about four hundred lines of JavaScript
  # and nothing had ever run them. Every test asserted on the HTML as a string, and a string check
  # passes just as well when the viewer throws on its first line and the reader gets empty boxes.
  #
  # Eight scenes, chosen to cover all six view kinds: a profile, a heatmap, bodies, paths, a
  # volume with its slice montage, and the scalar chart.
  report:
    name: report viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: build the reports
        run: |
          set -euo pipefail
          mkdir -p target/reports
          for scene in 04-heater-and-bar 06-orbits 10-lamp-on-a-mirror 14-a-world                        15-a-hot-spot-in-a-block 16-a-room-with-a-ceiling                        26-poiseuille-in-a-cooling-channel 27-a-cavity-ringing-at-its-own-frequency; do
            cargo run --locked --release -p pantometry-world --               "crates/pantometry-world/scenes/$scene.json" "target/reports/$scene.html"
          done
      - name: run the viewer and assert on what it drew
        run: node tools/report-check/check.js target/reports/*.html

  # The Python bindings, built and tested the way somebody would install them.
  #
  # A separate job because they are a separate workspace: pyo3 brings fifteen crates and links
  # libpython, and the library's lockfile and `deny.toml` allow-list should not have to
  # accommodate that to compile a physics crate. Nothing here is in `--workspace`.
  #
  # `maturin build` rather than `cargo build`, and then the wheel is *installed* — because the
  # claim is "pip install pantometry then import pantometry", and a cdylib that compiles proves neither
  # half of it. abi3, so one wheel serves 3.10 upward and the job does not need a matrix.
  viewer:
    name: native viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/viewer
      # Its own workspace, excluded from the root one, so `lint` and `test` above do not reach it
      # — the same hole the python bindings had until this job existed.
      - name: fmt and clippy
        working-directory: runtime/viewer
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      # `viewer-core` is where the arithmetic is and it needs no GPU, so it runs here. The window
      # and `--snapshot` are built but not run: a runner has no display, and a software adapter
      # would be checking a different renderer than anyone uses. That limit is stated rather than
      # papered over with a test that passes for the wrong reason.
      - name: the arithmetic, against real run files
        working-directory: runtime/viewer
        run: cargo test -p viewer-core
      - name: the shell still compiles
        working-directory: runtime/viewer
        run: cargo build --workspace

  # **The editor had no job at all**, which is the hole the `python` job's comment warns about:
  # a nested workspace is excluded from the root one, so `lint` and `test` never reached it. It is
  # the largest of the four — 371 external crates against the library's 12 — and it had gone
  # unchecked since it was written.
  #
  # The shaded viewport needs a GL context and a runner has none, so `editor-core` runs here and the
  # shell is built. `editor-core` is where the decisions are: the surface's size against the box it
  # was placed in, its normals facing outwards, and its colours following the ramp. The GL pass
  # itself is checked by hand with `PANTOMETRY_VIEWPORT_SHOT`, which reads the framebuffer back —
  # see this workspace's README on why a screenshot from outside the process is not evidence.
  editor:
    name: scene editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/editor
      # eframe needs these to link on a runner. The equivalents come with the SDK on the other two
      # platforms, which is why only this job lists them.
      - name: the toolkit the window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      # `cargo doc` is in here and not in the viewer's or the gpu's job because this workspace had
      # a broken intra-doc link in it from the day it was written -- `Pose::point_to_world`, with no
      # `Pose` in scope -- and nothing was ever going to find it. That is what an unchecked
      # workspace costs.
      - name: fmt, clippy, docs
        working-directory: runtime/editor
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: the decisions, which need no window
        working-directory: runtime/editor
        run: cargo test -p editor-core
      - name: the native shell still compiles
        working-directory: runtime/editor
        run: cargo build --workspace
      # The browser shell shares `editor-core` rather than carrying a copy, so this is the check
      # that the shared half stays free of anything native.
      - name: and so does the browser one
        working-directory: runtime/editor
        run: cargo build -p editor-wasm --target wasm32-unknown-unknown

  gpu:
    name: gpu accelerator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/gpu
      - name: fmt and clippy
        working-directory: runtime/gpu
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
      # The comparison against the CPU domain needs a real adapter, which a runner has not got.
      # Every test skips with a printed reason rather than quietly, and a software rasteriser is
      # deliberately not used: it would be checking a different implementation than anyone runs.
      - name: it builds, and the tests say why they skipped
        working-directory: runtime/gpu
        run: cargo test -- --nocapture

  python:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      # The nested workspace is excluded from the root one, so the `lint` job above does not
      # reach it and it had gone unlinted since it was written — a `!(x > 0.0)` sat in
      # `add_bar` for as long as the file existed. Cheap to run here; the alternative is
      # remembering.
      - name: fmt and clippy
        working-directory: bindings/python
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
      - name: build a wheel
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.7,<2.0"
          python -m maturin build --release --out dist
      - name: install it and run its tests
        working-directory: bindings/python
        run: |
          python -m pip install dist/*.whl
          python tests/test_pantometry.py

  # Licences and advisories, against the allow-list in `deny.toml`.
  #
  # The tree was audited once by hand and came back clean. That was a snapshot: one added
  # dependency or one upstream relicensing and it stops being true, silently. This crate
  # already enforces its MSRV and its determinism in CI rather than promising them, and a
  # licence claim deserves the same treatment.
  #
  # `pantometry-world` is inside this check. It is dependency-light today — serde and the SDK —
  # but it is the crate most likely to reach for something heavy, and the moment it does the
  # allow-list is the only thing standing between the workspace and a licence nobody read.
  deny:
    name: licences, advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # WebAssembly builds at all. Catches an accidental dependency on something the
  # target does not have — a thread, a clock, the filesystem.
  #
  # `--exclude pantometry-world` in this job and the two below it.
  #
  # WebAssembly, determinism and the 1.78 floor are promises the *library* makes to the
  # people who depend on it from crates.io. `pantometry-world` is an application that is not
  # published, has no dependents, and exists to exercise the SDK from outside; holding it
  # to those three would be inventing a constraint nobody asked for, and the first heavy
  # dependency it needs would fail a promise the library is still keeping perfectly well.
  # It is covered by `lint`, `test` and `release`, which is where its correctness lives.
  wasm:
    name: build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --locked --workspace --exclude pantometry-world --target wasm32-unknown-unknown

  # WebAssembly *runs*, and agrees with every other platform to the last bit.
  #
  # The job above proves the crates compile for wasm; this one proves the README's
  # "in WebAssembly" claim, which is a claim about results and not about compiling.
  # The pinned RNG digest and every closed-form physics comparison are executed
  # under wasmtime, so a difference in how the target rounds would fail here.
  wasm-determinism:
    name: test (wasm32-wasip1, wasmtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: cargo test --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test --locked --workspace --exclude pantometry-world --target wasm32-wasip1

  # The oldest toolchain the workspace is claimed to build on.
  #
  # 1.78, and the number comes from the lockfile rather than from the code. The first
  # attempt pinned 1.75 and failed with `failed to parse lock file`: `Cargo.lock` is
  # format version 4, which cargo could not read until 1.78, so that build never
  # reached a line of Rust. The newest language feature in the workspace is
  # `let ... else` from 1.65, so the *source* floor is lower and this job does not
  # measure it.
  #
  # That distinction matters for who is asking. A consumer depending on
  # `pantometry-optics` never sees this lockfile, so their constraint is the source; CI
  # builds `--locked` on purpose, so its constraint is the lockfile format. The
  # declared `rust-version` follows this job, because it is the stronger of the two
  # and a declared MSRV is a promise about what has been compiled rather than a
  # theoretical minimum.
  msrv:
    name: build (Rust 1.78)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.78
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --locked --workspace --exclude pantometry-world
