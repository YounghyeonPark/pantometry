# Above the library, in the app workspace, for two reasons.
#
# The dependency one, measured: the library resolves 12 external crates and a wgpu stack is 86.
#
# And one that is not about dependencies. WGSL has no `f64`, so a compute kernel is a *different
# computation* from the `f64` domain it accelerates — not a faster one. That is a claim the
# library must not make on its own behalf, and this crate exists to measure how far apart the two
# actually land.
[package]
name = "pantometry-gpu"
description = "An accelerator for pantometry's explicit stencils, with the CPU domain as the reference"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
pantometry-core = { workspace = true }
pantometry-thermal = { workspace = true }
# For the `Accelerator` a scene's `"device": "gpu"` is honoured by. The scene format is beside this
# crate now rather than below it, and the arrow is unchanged: neither depends on the other's shell.
pantometry-world = { workspace = true }
pollster = "0.4"
wgpu = "22"

[dev-dependencies]
serde_json = { workspace = true }
pantometry-units = { workspace = true }
