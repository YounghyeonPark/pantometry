[package]
name = "pantometry-world"
description = "The first consumer of the pantometry SDK: scenes described as data, run and drawn"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# An application, not a library on the registry. It is here to exercise the SDK from the
# outside, and shipping it to crates.io would say something about it that is not true.
publish = false

[dev-dependencies]
# Only to decode the tiles a test reads. The crate itself hands them out as bytes.
image = { version = "0.25", default-features = false, features = ["png"] }
# Only for the tests, which build and take apart scenes as JSON. The crate derives `serde`'s traits
# and leaves the format to whoever reads a scene; it was a normal dependency that nothing used.
serde_json = { workspace = true }

[dependencies]
pantometry = { workspace = true }
# For the vector constructors the mechanics domains take, and for the molecular crate's
# reduced-unit helpers, which the facade does not re-export.
glam = { workspace = true }
serde = { workspace = true }

